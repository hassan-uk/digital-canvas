<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VisualGrid</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <h1>VisualGrid</h1>

  <div class="toolbar">
    <button class="smallBtn" id="paintBtn" title="Paintbrush (P)">P</button>
    <button class="smallBtn" id="highlightBtn" title="Highlighter (H)">H</button>
    <button class="smallBtn" id="eraseBtn" title="Eraser (E)">E</button>

    <div class="divider"></div>

    <input type="color" id="colorPicker" title="Select colour" value="#000000">
    <input type="range" id="brushSize" title="Change brush size" min="1" max="25" value="5">

    <div class="divider"></div>

    <div class="dropdown">
      <button id="addTextBtn" class="smallBtn">Text ▼</button>

      <div class="dropdown-menu">
        <select id="fontFamily">
          <option value="Arial">Arial</option>
          <option value="Verdana">Verdana</option>
          <option value="Helvetica">Helvetica</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Trebuchet MS">Trebuchet MS</option>
          <option value="Impact">Impact</option>
          <option value="Comic Sans MS">Comic Sans</option>
          <option value="Palatino Linotype">Palatino</option>
          <option value="Garamond">Garamond</option>
          <option value="Bookman Old Style">Bookman</option>
          <option value="Tahoma">Tahoma</option>
          <option value="Lucida Console">Lucida Console</option>
          <option value="Monaco">Monaco</option>
        </select>

        <input type="number" id="fontSize" value="20" min="8" max="100">

        <div class="textButtons">
          <button id="boldBtn">Bold</button>
          <button id="italicBtn">Italic</button>
          <button id="underlineBtn">Underline</button>
        </div>

        <div class="textButtons">
          <button id="alignLeftBtn">Left</button>
          <button id="alignCenterBtn">Center</button>
          <button id="alignRightBtn">Right</button>
        </div>
      </div>
    </div>

    <div class="drop-wrap" id="drop-shapes">
      <button class="tool-btn" onclick="toggleDropdown('drop-shapes')" title="Insert shapes">Shapes</button>
        <div class="drop-menu">
          <button id="addRectBtn" title="Rectangle" class ="drop-item iconBtn"><i class="bi bi-square-fill"></i></button>
          <button id="addCircleBtn" title="Circle" class ="drop-item iconBtn"><i class="bi bi-circle-fill"></i></button>
          <button id="addTriangleBtn" title="Triangle" class ="drop-item iconBtn"><i class="bi bi-triangle-fill"></i></button>
          <button id="addLineBtn" title="Straight line" class ="drop-item iconBtn">—</button>
          <label class="fillToggle">
            <input type="checkbox" id="fillToggle" title="Fill shape">
            Fill
          </label>
        </div>
    </div>

    <div class="drop-wrap" id="drop-edit">
      <button class="tool-btn" onclick="toggleDropdown('drop-edit')">Edit</button>
      <div class="drop-menu">
        <button class="drop-item" id="selectBtn">Select</button>
        <button class="drop-item" id="deleteBtn">Delete Selected</button>
        <button class="drop-item" id="cropBtn">Crop</button>
        <button class="drop-item" id="resizeCanvasBtn" title="Change canvas size (Ctrl+R)">Resize Canvas</button>
      </div>
    </div>

    <div class="drop-wrap" id="drop-file">
      <button class="tool-btn" onclick="toggleDropdown('drop-file')">File</button>
      <div class="drop-menu">
        <label class="fileLabel">
          Import Image
          <input type="file" id="importImageInput" accept="image/*">
        </label>
        <label class="fileLabel">
          Load Project
          <input type="file" id="loadProjectInput" accept="application/json">
        </label>
        <button id="saveProjectBtn">Save Project</button>
        <button id="savePngBtn">Save PNG</button>
      </div>
    </div>

    <div class="drop-wrap" id="drop-layers">
      <button class="tool-btn" onclick="toggleDropdown('drop-layers')">Layers</button>
      <div class="drop-menu" id="layerPanel">
        <button class="drop-item iconRow" id="addLayerBtn">
          <i class="bi bi-plus-lg"></i>
          <span>Add</span>
        </button>
        <button class="drop-item iconRow" id="deleteLayerBtn">
          <i class="bi bi-trash"></i>
          <span>Delete</span>
        </button>
        <div class="divider"></div>
      </div>
    </div>

    <div class="divider"></div>

    <button class="smallBtn" id="zoomOutBtn"><i class="bi bi-zoom-out"></i></button>
    <button class="smallBtn" id="zoomInBtn"><i class="bi bi-zoom-in"></i></button>

    <button class="smallBtn" id="undoBtn" title="Undo (Ctrl+Z)"><i class="bi bi-arrow-counterclockwise"></i></button>
    <button class="smallBtn" id="redoBtn" title="Redo (Ctrl+Y)"><i class="bi bi-arrow-clockwise"></i></button>

    <button id="clearButton">Clear</button>
  </div>

  <div class="mainLayout">
    <canvas id="canvas" width="1200" height="630"></canvas>
  </div>

  <div id="savePopup" class="savePopup">
    <div class="popup-content">
      <h2>Save Your Project</h2>
      <input type="text" id="projectNameInput" placeholder="Enter project name">
      <div class="popup-buttons">
        <button id="saveConfirmBtn">Save</button>
        <button id="saveCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>

  <!-- shortcut library -->
  <script type="text/javascript" src="shortcut.js"></script>

  <!-- shortcuts -->
  <script>
    shortcut.add("p", function() {
      document.getElementById('paintBtn').click();
    });   

    shortcut.add("h", function() {
      document.getElementById('highlightBtn').click();
    });

    shortcut.add("e", function() {
      document.getElementById('eraseBtn').click();
    }); 

    shortcut.add("Ctrl+Z", function() {
      document.getElementById("undoBtn").click();
    })

    shortcut.add("Ctrl+Y", function() {
      document.getElementById("redoBtn").click();
    })

    shortcut.add("Ctrl+R", function() {
      document.getElementById("resizeCanvasBtn").click();
    })
  </script>

</body>
</html>
