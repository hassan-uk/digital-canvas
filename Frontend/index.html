<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VisualGrid</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Playfair+Display&family=Lobster&family=Oswald&family=Montserrat&family=Pacifico&family=Dancing+Script&family=Raleway&display=swap" rel="stylesheet">
</head>
<body>
  <h1>VisualGrid</h1>

  <!-- Toolbar  -->
  <div class="toolbar">
    <input type="color" id="colorPicker" value="#000000">
    <input type="range" id="brushSize" min="1" max="25" value="5">

    <button id="addRectBtn" class="iconBtn"><i class="bi bi-square-fill"></i></button>
    <button id="addCircleBtn" class="iconBtn"><i class="bi bi-circle-fill"></i></button>
    <button id="addTriangleBtn" class="iconBtn"><i class="bi bi-triangle-fill"></i></button>
    <button id="addLineBtn" class="iconBtn">—</button>

    <label class="fillToggle">
      <input type="checkbox" id="fillToggle">
      Fill
    </label>

    <!-- Text Dropdown -->
    <div class="dropdown">
      <button id="addTextBtn">Text ▼</button>
      <div class="dropdown-menu">

        <!-- Font Family -->
        <label>Font</label>
        <select id="fontFamily">
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Georgia">Georgia</option>
          <option value="Verdana">Verdana</option>
          <option value="Roboto">Roboto</option>
          <option value="Playfair Display">Playfair Display</option>
          <option value="Lobster">Lobster</option>
          <option value="Oswald">Oswald</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Pacifico">Pacifico</option>
          <option value="Dancing Script">Dancing Script</option>
          <option value="Raleway">Raleway</option>
        </select>

        <!-- Font Size -->
        <label>Size</label>
        <input type="range" id="fontSize" min="1" max="100" value="20">

        <!-- Alignment -->
        <label>Alignment</label>
        <div class="alignmentOptions">
          <button id="alignLeftBtn" class="iconBtn"><i class="bi bi-text-left"></i></button>
          <button id="alignCenterBtn" class="iconBtn"><i class="bi bi-text-center"></i></button>
          <button id="alignRightBtn" class="iconBtn"><i class="bi bi-text-right"></i></button>
        </div> <!-- ← closes alignmentOptions -->

        <!-- Bold, Italic, Underline -->
        <div class="textFormatting">
          <button id="boldBtn" class="iconBtn"><i class="bi bi-type-bold"></i></button>
          <button id="italicBtn" class="iconBtn"><i class="bi bi-type-italic"></i></button>
          <button id="underlineBtn" class="iconBtn"><i class="bi bi-type-underline"></i></button>
        </div> <!-- ← closes textFormatting -->

        <button id="insertTextBtn">Add Text</button>

      </div> <!-- ← closes dropdown-menu -->
    </div> <!-- ← closes dropdown -->

    <button id="deleteBtn">Delete Selected</button>
    <button id="clearButton">Clear</button>
    <button id="saveProjectBtn">Save Project</button>

    <label class="fileLabel">
      Load Project
      <input type="file" id="loadProjectInput" accept="application/json">
    </label>

  </div> <!-- ← closes toolbar -->

  <!-- Canvas -->
  <canvas id="canvas" width="1200" height="630"></canvas>

  <!-- Save Project Popup -->
  <div id="savePopup" class="savePopup">
    <div class="popup-content">
      <h2>Save Your Project</h2>
      <input type="text" id="projectNameInput" placeholder="Enter project name" />
      <div class="popup-buttons">
        <button id="saveConfirmBtn">Save</button>
        <button id="saveCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
